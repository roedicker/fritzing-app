name: Build Fritzing Windows x64

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout current repository (workflow only)
        uses: actions/checkout@v4

      - name: 📥 libgit2 (checkout)
        uses: actions/checkout@v4
        with:
          repository: libgit2/libgit2
          path: libgit2
          ref: v1.7.2

      - name: 🧰 Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: 🔨 Build libgit2
        working-directory: libgit2
        run: |
          mkdir build
          cd build
          cmake .. -G "NMake Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -DBUILD_CLI=OFF `
            -DBUILD_TESTS=OFF `
            -DBUILD_CLAR=OFF `
            -DUSE_HTTPS=OFF `
            -DUSE_SSH=OFF `
            -DUSE_SSPI=OFF
          nmake

      - name: 📦 Setup Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: 📥 fritzing-app (checkout)
        uses: actions/checkout@v4
        with:
          repository: fritzing/fritzing-app
          path: fritzing-app
          submodules: recursive
      
      - name: ⚙️ Copy libgit2 (for fritzing-app)
        run: |
          mkdir libgit2\build64\Release 2>nul
          copy libgit2\build\git2.lib libgit2\build64\Release\

      - name: 📥 Download Boost (for fritzing-app)
        working-directory: ${{ github.workspace }}
        run: |
          Invoke-WebRequest -Uri https://archives.boost.io/release/1.76.0/source/boost_1_76_0.zip -OutFile boost.zip
          Expand-Archive boost.zip -DestinationPath .

      - name: ⚙️ Configure qmake (for fritzing-app)
        working-directory: ${{ github.workspace }}/fritzing-app
        run: |
          qmake phoenix.pro ` 
          "BOOSTPATH=${{ github.workspace }}/boost_1_76_0" `
          "INCLUDEPATH+=${{ github.workspace }}/boost_1_76_0"

      - name: 🔨 Build fritzing-app
        working-directory: ${{ github.workspace }}/fritzing-app
        run: |
          nmake

      - name: 📁 Prepare artifact
        run: |
          mkdir dist
          copy fritzing-app\release\Fritzing.exe dist\

      - name: 📦 Bundle Qt dependencies
        run: |
          windeployqt dist\Fritzing.exe

      - name: 📦 Package
        run: |
          powershell Compress-Archive -Path dist\* -DestinationPath fritzing-windows-x64.zip

      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fritzing-windows-x64
          path: fritzing-windows-x64.zip