name: Build Fritzing Windows x64

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 📥 Own repository (workflow only)
      - name: 📥 Checkout current repository
        uses: actions/checkout@v4

      # 📥 libgit2 (checkout)
      - name: 📥 Checkout libgit2
        uses: actions/checkout@v4
        with:
          repository: libgit2/libgit2
          path: libgit2
          ref: v1.7.2

      # 🧰 MSVC aktivieren (CRITICAL)
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # 🔍 Debug (optional aber extrem hilfreich)
      - name: 🔍 Verify compiler
        run: |
          where cl
          cl

      # 🔨 libgit2 build (robust!)
      - name: 🔨 Build libgit2
        working-directory: libgit2
        run: |
          mkdir build
          cd build
          cmake .. -G "NMake Makefiles" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DUSE_HTTPS=OFF
          nmake

      - name: 📦 Setup Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      # 📥 fritzing-app (checkout)
      - name: 📥 fritzing-app (checkout)
        uses: actions/checkout@v4
        with:
          repository: fritzing/fritzing-app
          path: fritzing-app
          submodules: recursive
      
      # ⚙️ fritzing-app (configure)
      - name: ⚙️ Configure (qmake)
        working-directory: fritzing-app
        run: |
          qmake phoenix.pro

      - name: 🔨 Build fritzing-app
        working-directory: fritzing-app
        run: |
          nmake

      - name: 📁 Prepare artifact
        run: |
          mkdir dist
          copy fritzing-app\release\Fritzing.exe dist\

      - name: 📦 Bundle Qt dependencies
        run: |
          windeployqt dist\Fritzing.exe

      - name: 📦 Package
        run: |
          powershell Compress-Archive -Path dist\* -DestinationPath fritzing-windows-x64.zip

      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fritzing-windows-x64
          path: fritzing-windows-x64.zip